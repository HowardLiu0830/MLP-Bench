[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlpbench"
version = "0.1.0"
description = "MLP-Bench: auto-formalization, Lean proving, and FL proof verification"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Howard Liu" }]

# Kept empty on purpose: what this needs is not pip-resolvable (the `claude` / `codex`
# CLIs, `bwrap`, and a built Lean project). Add runtime deps here as code lands.
dependencies = []

[project.optional-dependencies]
proxy = ["litellm[proxy]>=1.40"]   # open-source / OpenRouter models via a LiteLLM proxy

[project.scripts]
mlpbench = "mlpbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpbench"]
