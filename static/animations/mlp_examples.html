<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLP-Bench interactive task examples</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../vendor/katex/dist/katex.min.css">
<script src="../vendor/katex/dist/katex.min.js"></script>
<script src="../vendor/katex/dist/contrib/auto-render.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.65 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243047;background:#fff}button{font:inherit;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#3a8fdc;font-weight:800;text-transform:uppercase}h1{font-size:22px;margin:3px 0 0;color:#17213b}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}nav button{border:1px solid #e0e4ee;background:#f8fafc;border-radius:10px;padding:12px 6px;color:#64748b;font-weight:700}nav button[aria-selected=true]{background:#3a8fdc;color:white;border-color:#3a8fdc;box-shadow:0 5px 14px #3a8fdc2e}nav button:last-child[aria-selected=true]{background:#078563;border-color:#078563}button:focus-visible{outline:3px solid #a9d1f3;outline-offset:3px}.controls{display:flex;gap:6px}.controls button{background:white;border:1px solid #dce1ea;border-radius:8px;padding:6px 10px;font-size:12px;color:#475569}.box{border:1px solid #dce1ea;border-radius:12px;overflow:hidden}.bar{padding:8px 16px;background:#edf1f8;color:#52617a;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.question{padding:15px 18px}.question p{margin:0 0 8px}.formula{font-family:Georgia,serif;font-size:18px;color:#173a5c;text-align:center;padding:10px;background:#f2f8fd;border-radius:8px;margin:10px 0}.source{font-size:11px;color:#8290a4;margin-top:8px}.label-row{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;font-size:11px;letter-spacing:.1em;font-weight:800;color:#64748b}.label-row span:last-child{letter-spacing:0;font-weight:500}.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.node{position:relative;border:1px solid #e0e4ee;border-radius:10px;padding:12px 9px;color:#94a3b8;background:#f8fafc;transition:background .3s,border-color .3s}.node:not(:last-child):after{content:"→";position:absolute;right:-13px;top:30px;color:#b7bfd0}.node b{display:block;font-size:12px;color:inherit}.node small{font-size:10px}.node .number{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e9edf3;font-size:10px;margin-bottom:7px}.node.active{border-color:#7fb8ea;background:#eaf4fd;color:#1f73bf;box-shadow:0 0 0 3px #3a8fdc14}.node.active .number{background:#3a8fdc;color:white}.node.done{border-color:#a7dfce;background:#f0fdf7;color:#047857}.node.done .number{background:#d1fae5}.progress{height:3px;background:#edf0f6;margin-top:14px;border-radius:3px;overflow:hidden}.progress div{height:100%;background:#7fb8ea;transition:width .4s;width:0}.trace{min-height:116px;padding:15px 18px;margin:12px 0 18px;border-radius:10px;background:#f8fafc;border:1px solid #e8ecf2}.trace h3{font-size:13px;margin:0 0 5px;color:#1f73bf}.trace p{margin:0;font-size:13px}.trace code{font-size:12px;color:#1f73bf}.output .bar{background:#e8f6ef;color:#087555;display:flex;justify-content:space-between}.output-body{padding:15px 18px}.output-body.waiting{color:#94a3b8;font-size:13px}.output h3{margin:0 0 8px;font-size:15px}.output p{margin:6px 0}.output pre{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;background:#f5f8fc;padding:14px;border-radius:8px;color:#334155}.pill{display:inline-block;background:#e5f7ed;color:#087555;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700}.error{color:#be3345}.note{font-size:11px;color:#7b879b;margin:12px 0 0}.fade{animation:appear .35s ease}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:600px){body{padding:14px}header{align-items:flex-start}h1{font-size:18px}.controls{flex-direction:column}nav button{font-size:11px;padding:10px 4px}.nodes{grid-template-columns:repeat(2,1fr);gap:10px}.node:after{display:none}.formula{font-size:15px}.question{padding:12px}.source{font-size:10px}.trace{min-height:140px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.question .katex{font-size:1.08em}
.question .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden}
html{height:100%;overflow:hidden}
body{height:100%;overflow:hidden;display:flex;flex-direction:column}
header,nav{flex-shrink:0}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
main>.box:first-child{flex-shrink:0;max-height:30%;overflow-y:auto}
.label-row,.nodes,.progress{flex-shrink:0}
.trace{flex-shrink:0;height:116px;min-height:0;overflow-y:auto}
.output{flex:1;min-height:320px;display:flex;flex-direction:column;background:#0b0e14;border-color:#292f3b;color:#dce3ee}
.output .bar{background:#191e28;color:#aab6c8;border-bottom:1px solid #2b3240;padding:11px 16px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.output .bar>span:first-child::before{content:'● ● ●';color:#68758b;letter-spacing:3px;margin-right:14px}
.output #output-status{color:#6ee7b7}
.output h3{color:#f1f5f9}
.output h3.error{color:#fda4af}
.output pre{background:transparent;color:#d4d4d4;font-size:12px;line-height:1.8;padding:0;border:0;margin:0;border-radius:0}
.output-body{background:#1e1e1e}
.output pre,.output pre span{color:#fff}
.output .note,.output-body.waiting{color:#9aa8bd}
.output .pill{background:#12352b;color:#86efac}
.output .formula{background:#151c29;color:#c6e0f7}
.output .output-body{scrollbar-color:#526078 #10151e}
.output-body::-webkit-scrollbar-track{background:#10151e!important}
.output-body::-webkit-scrollbar-thumb{background:#526078!important}
.output>.bar{flex-shrink:0}
main>.note{flex-shrink:0}
.output-body{flex:1;min-height:0;max-height:none;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#94a3b8 #f1f5f9;-webkit-overflow-scrolling:touch}
.output-body:focus-visible{outline:2px solid #3a8fdc;outline-offset:-3px}
.output-body::-webkit-scrollbar{width:8px}
.output-body::-webkit-scrollbar-track{background:#f1f5f9}
.output-body::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:8px}
@media(max-width:600px){.trace{height:100px;min-height:0}.output-body{max-height:none}.node{padding:6px 8px}.node .number{margin-bottom:2px}.label-row{margin:10px 0 8px}nav{margin-bottom:12px}main>.note{font-size:10px}}
.row-right{display:flex;align-items:center;gap:10px}.row-right button{background:#fff;border:1px solid #dce1ea;border-radius:999px;padding:2px 10px;font-size:11px;letter-spacing:0;font-weight:600;color:#475569}.row-right button:hover{border-color:#a9d1f3;background:#eaf4fd}
.progress div{transition:width 3s linear}
body{padding:18px 22px}
.walk{flex-shrink:0;margin:12px 0}.walk .bar{display:flex;justify-content:space-between}.walk #step-count{letter-spacing:.05em;color:#1f73bf}
.trace{height:128px;margin:0;border:0;border-radius:0;background:#f8fafc;padding:12px 18px;overflow-y:auto;scrollbar-width:thin}
.trace .step+.step{margin-top:10px;padding-top:10px;border-top:1px dashed #dce1ea}
.trace h3{display:flex;align-items:center;gap:8px}
.trace .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#3a8fdc;color:#fff;font-size:10px;flex-shrink:0}
@media(max-width:600px){.trace{height:150px}}
.trace .step{transition:opacity .6s ease,transform .6s ease}.trace .step.leaving{opacity:0;transform:translateY(-4px)}
.trace h3{font-size:15px;margin-bottom:6px}.trace p{font-size:14.5px;line-height:1.6}.trace code{font-size:13px}.trace .n{width:20px;height:20px;font-size:11px}
.trace{height:146px}@media(max-width:600px){.trace{height:170px}.trace h3{font-size:14px}.trace p{font-size:13.5px}}
.output{min-height:0}
main>.box:first-child{max-height:none;overflow:hidden}.trace{overflow:hidden}
body[data-task=verify] .trace h3,body[data-task=verify] .trace code{color:#1f8a5b}body[data-task=verify] .trace .n{background:#1f8a5b}
</style>
</head>
<body>
<main id="example" aria-live="off">
<div class="box"><div class="question" id="question"></div></div>
<div class="box walk"><div class="trace" id="trace" aria-live="polite"></div></div>
<div class="box output"><div class="bar"><span>Final output · scroll to explore</span><span id="output-status">Pending</span></div><div id="output" class="output-body waiting" role="region" aria-label="Final output" tabindex="0">The final output appears after the last step.</div></div>
</main>
<script src="mlp_examples.js?v=15"></script>
</body>
</html>
